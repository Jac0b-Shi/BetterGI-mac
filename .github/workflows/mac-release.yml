name: macOS Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bundle_short_version: ${{ steps.version.outputs.bundle_short_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag signature
        env:
          RELEASE_SIGNING_FINGERPRINT: B801AC543CB5B2BBF9407DB2EDDF1F5FEF954168
        shell: bash
        run: |
          set -euo pipefail

          # actions/checkout 会把本地 tag 引用强写成提交 SHA，
          # 必须通过 FETCH_HEAD 重新取回真正的 tag 对象再校验
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME"
          tag_object="$(git rev-parse FETCH_HEAD)"
          if [[ "$(git cat-file -t "$tag_object")" != "tag" ]]; then
            echo "Release tags must be signed annotated tags; lightweight tags are not accepted." >&2
            exit 1
          fi

          export GNUPGHOME="$RUNNER_TEMP/release-tag-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          key_file="$RUNNER_TEMP/release-signing-keys.gpg"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/Jac0b-Shi.gpg" \
            --output "$key_file"

          mapfile -t downloaded_fingerprints < <(
            gpg --batch --show-keys --with-colons "$key_file" \
              | awk -F: '$1 == "fpr" { print toupper($10) }'
          )
          if ! printf '%s\n' "${downloaded_fingerprints[@]}" \
            | grep -Fqx "$RELEASE_SIGNING_FINGERPRINT"; then
            echo "GitHub's published key set does not contain the pinned release signing key." >&2
            printf 'Expected fingerprint: %s\n' "$RELEASE_SIGNING_FINGERPRINT" >&2
            exit 1
          fi

          gpg --batch --import "$key_file" >/dev/null 2>&1

          if ! verification="$(git verify-tag --raw "$tag_object" 2>&1)"; then
            printf '%s\n' "$verification" >&2
            echo "Release tag signature verification failed." >&2
            exit 1
          fi

          validsig="$({ printf '%s\n' "$verification"; } \
            | awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print toupper($3) " " toupper($NF) }' \
            | tail -n 1)"
          if [[ -z "$validsig" ]]; then
            printf '%s\n' "$verification" >&2
            echo "GnuPG did not report a VALIDSIG status for the release tag." >&2
            exit 1
          fi

          signing_fingerprint="${validsig%% *}"
          primary_fingerprint="${validsig##* }"
          if [[ "$signing_fingerprint" != "$RELEASE_SIGNING_FINGERPRINT" \
            && "$primary_fingerprint" != "$RELEASE_SIGNING_FINGERPRINT" ]]; then
            echo "Release tag was signed by an unauthorized key." >&2
            printf 'Signing fingerprint: %s\n' "$signing_fingerprint" >&2
            printf 'Primary fingerprint: %s\n' "$primary_fingerprint" >&2
            printf 'Expected fingerprint: %s\n' "$RELEASE_SIGNING_FINGERPRINT" >&2
            exit 1
          fi

          {
            echo "### Release tag signature"
            echo
            echo "- Tag: \`$GITHUB_REF_NAME\`"
            echo "- Authorized primary fingerprint: \`$RELEASE_SIGNING_FINGERPRINT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$version" =~ $semver_pattern ]]; then
            echo "Tag must use semantic versioning, for example v0.1.0 or v0.1.0-beta.1." >&2
            exit 1
          fi
          bundle_short_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          prerelease="${BASH_REMATCH[5]}"
          if [[ -n "$prerelease" ]]; then
            IFS='.' read -r -a prerelease_identifiers <<< "$prerelease"
            for identifier in "${prerelease_identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && ${#identifier} -gt 1 && "$identifier" == 0* ]]; then
                echo "Numeric prerelease identifiers must not contain leading zeroes." >&2
                exit 1
              fi
            done
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit contained in origin/main." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundle_short_version=$bundle_short_version" >> "$GITHUB_OUTPUT"
          if [[ -n "$prerelease" ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: verify-tag
    runs-on: macos-15
    permissions:
      contents: write
    env:
      DIST_DIR: ${{ github.workspace }}/dist/mac

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Install static gate tools
        run: brew install ripgrep mingw-w64

      - name: Select release signing mode
        id: release_mode
        env:
          MACGI_CERTIFICATE_P12: ${{ secrets.MACGI_CERTIFICATE_P12 }}
          MACGI_CERTIFICATE_PASSWORD: ${{ secrets.MACGI_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.MACGI_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACGI_NOTARY_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACGI_NOTARY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          present=0
          for variable in \
            MACGI_CERTIFICATE_P12 \
            MACGI_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD
          do
            if [[ -n "${!variable}" ]]; then
              present=$((present + 1))
            fi
          done

          if [[ "$present" == 0 ]]; then
            {
              echo "mode=adhoc"
              echo "adhoc=1"
              echo "timestamp=0"
              echo "artifact_suffix=-unsigned"
              echo "bundle_identifier=cn.jac0bshi.bettergi.mac.adhoc"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### Ad-hoc release"
              echo
              echo "No Developer ID credentials are configured."
              echo "Artifacts will be ad-hoc signed, unnotarized, and marked as unsigned."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$present" == 5 ]]; then
            {
              echo "mode=developer-id"
              echo "adhoc=0"
              echo "timestamp=1"
              echo "artifact_suffix="
              echo "bundle_identifier=cn.jac0bshi.bettergi.mac"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets are only partially configured." >&2
            echo "Configure all five secrets or remove all of them for an explicit ad-hoc release." >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        id: signing
        if: steps.release_mode.outputs.mode == 'developer-id'
        env:
          MACGI_CERTIFICATE_P12: ${{ secrets.MACGI_CERTIFICATE_P12 }}
          MACGI_CERTIFICATE_PASSWORD: ${{ secrets.MACGI_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/bettergi-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACGI_CERTIFICATE_P12" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACGI_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
              | head -n 1
          )"
          if [[ -z "$identity" ]]; then
            echo "The imported PKCS#12 does not contain a Developer ID Application identity." >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain_path" >> "$GITHUB_OUTPUT"

      - name: Static production gate
        run: scripts/verify-core-static.sh

      - name: Test Swift platform layer
        run: swift test --package-path MacGI

      - name: Package application
        env:
          CONFIGURATION: Release
          MACGI_APP_OUTPUT_ROOT: ${{ runner.temp }}/bettergi-release
          MACGI_APP_NAME: BetterGI.app
          MACGI_SHORT_VERSION: ${{ needs.verify-tag.outputs.bundle_short_version }}
          MACGI_BUNDLE_VERSION: ${{ github.run_number }}
          MACGI_BUNDLE_IDENTIFIER: ${{ steps.release_mode.outputs.bundle_identifier }}
          MACGI_ALLOW_ADHOC_SIGNING: ${{ steps.release_mode.outputs.adhoc }}
          MACGI_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          MACGI_CODESIGN_TIMESTAMP: ${{ steps.release_mode.outputs.timestamp }}
        run: MacGI/scripts/package-macgi-app.sh

      - name: Notarize application
        if: steps.release_mode.outputs.mode == 'developer-id'
        env:
          APPLE_ID: ${{ secrets.MACGI_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACGI_NOTARY_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACGI_NOTARY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/bettergi-release/BetterGI.app"
          submission="$RUNNER_TEMP/BetterGI-notarization.zip"
          ditto -c -k --keepParent "$app" "$submission"
          xcrun notarytool submit "$submission" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Build release artifacts
        env:
          APPLE_ID: ${{ secrets.MACGI_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACGI_NOTARY_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACGI_NOTARY_PASSWORD }}
          ARTIFACT_SUFFIX: ${{ steps.release_mode.outputs.artifact_suffix }}
          RELEASE_MODE: ${{ steps.release_mode.outputs.mode }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIST_DIR"
          app="$RUNNER_TEMP/bettergi-release/BetterGI.app"
          zip="$DIST_DIR/BetterGI-mac-v${VERSION}-arm64${ARTIFACT_SUFFIX}.zip"
          dmg="$DIST_DIR/BetterGI-mac-v${VERSION}-arm64${ARTIFACT_SUFFIX}.dmg"
          ditto -c -k --keepParent "$app" "$zip"
          MacGI/scripts/create-macgi-dmg.sh "$app" "$dmg" "BetterGI ${VERSION}"
          if [[ "$RELEASE_MODE" == "developer-id" ]]; then
            codesign \
              --force \
              --timestamp \
              --sign "$SIGNING_IDENTITY" \
              "$dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          else
            codesign --verify --deep --strict --verbose=2 "$app"
          fi
          (
            cd "$DIST_DIR"
            shasum -a 256 "${zip##*/}" "${dmg##*/}" > SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v4
        with:
          name: BetterGI-mac-${{ needs.verify-tag.outputs.version }}-arm64${{ steps.release_mode.outputs.artifact_suffix }}
          path: dist/mac/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
          RELEASE_MODE: ${{ steps.release_mode.outputs.mode }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/mac/* --clobber
          else
            args=(
              "$GITHUB_REF_NAME"
              dist/mac/*
              --generate-notes
            )
            if [[ "$RELEASE_MODE" == "developer-id" ]]; then
              args+=(--title "BetterGI macOS ${VERSION}")
            else
              args+=(
                --title "BetterGI macOS ${VERSION} (unsigned)"
                --notes "⚠️ 此版本使用 ad-hoc 签名且未经过 Apple 公证。首次打开需要在 macOS 系统设置的隐私与安全性页面手动允许；升级后可能需要重新授予屏幕录制和辅助功能权限。"
              )
            fi
            if [[ "$PRERELEASE" == "true" || "$RELEASE_MODE" != "developer-id" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          keychain="${{ steps.signing.outputs.keychain }}"
          if [[ -n "$keychain" && -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12"
